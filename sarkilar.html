<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Şarkılar</title>
  <style>
    body {
      font-family: Georgia, serif;
      background-color: #fdf9f3;
      color: #4a3e2b;
      padding: 30px;
    }

    .header {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 40px;
    }

    .playlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .playlist-box {
      background-color: #fffaf1;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #ccbfa7;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
    }

    iframe {
      width: 100%;
      height: 352px;
      border-radius: 12px;
      border: none;
    }

    h2 {
      margin-bottom: 15px;
      font-size: 22px;
      color: #5b4a2e;
    }
  </style>
</head>
<body>

  <div class="header">🎧 Şarkılar</div>

  <div class="playlist-grid">
    <div class="playlist-box">
      <h2>🎶 Playlist 1 - yağmurla dans</h2>
      <iframe 
        src="https://open.spotify.com/embed/playlist/5buifQNSbjvsgiJ3U0CR6M?utm_source=generator&theme=0" 
        allowtransparency="true" allow="encrypted-media">
      </iframe>
    </div>

    <div class="playlist-box">
      <h2>🌙 Playlist 2 - etrafı sallamalık</h2>
      <iframe 
        src="https://open.spotify.com/embed/playlist/299ukfcFX5wFxcPESoOw94?utm_source=generator&theme=0" 
        allowtransparency="true" allow="encrypted-media">
      </iframe>
    </div>

    <div class="playlist-box">
      <h2>🌧️ Playlist 3 - soğuk yollar</h2>
      <iframe 
        src="https://open.spotify.com/embed/playlist/5iHbkctIV87vcgl51s7cCN?utm_source=generator&theme=0" 
        allowtransparency="true" allow="encrypted-media">
      </iframe>
    </div>

    <div class="playlist-box">
      <h2>💭 Playlist 4 - güneş gibi sıcak</h2>
      <iframe 
        src="https://open.spotify.com/embed/playlist/22glKTTH5NoErZFhQgfmJm?utm_source=generator&theme=0" 
        allowtransparency="true" allow="encrypted-media">
      </iframe>
    </div>
  </div>

</body>
</html>
