<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Şiir Gönder</title>
  <style>
    body {
      background-color: #fbf8f0;
      font-family: Georgia, serif;
      color: #5a3e1b;
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: #d8c3a5;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 3px solid #a9834a;
    }

    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #fffaf2;
      padding: 30px;
      border: 2px solid #a9834a;
      border-radius: 12px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: Georgia, serif;
    }

    button {
      margin-top: 20px;
      background-color: #a9834a;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #8d6b33;
    }
  </style>
</head>
<body>

  <div class="header">Anonim Şiir Gönder</div>

  <div class="form-container">
    <form onsubmit="alert('Şiiriniz anonim olarak gönderildi. Teşekkürler!'); return false;">
      <label for="poem">Şiiriniz</label>
      <textarea id="poem" name="poem" rows="8" placeholder="Buraya şiirinizi yazın..." required></textarea>
      <button type="submit">Gönder</button>
    </form>
  </div>

<script>
  const form = document.querySelector("form");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const siir = document.getElementById("poem").value.trim();
    if (siir.length > 0) {
      localStorage.setItem("gununSiiri", siir);
      alert("Şiiriniz kaydedildi! Anasayfada Günün Şiiri olarak gösterilecektir.");
      form.reset();
    }
  });
</script>


</body>
</html>
